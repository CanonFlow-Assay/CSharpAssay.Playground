name: CSharpAssay Playground

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      assay_ref:
        description: Override the configured CSharpAssay revision for .NET 11 and C# 15
        type: string
        required: false

permissions:
  contents: read

jobs:
  evidence:
    name: .NET 11 native evidence gate
    runs-on: ubuntu-latest
    env:
      ASSAY_RUNNER: ${{ github.workspace }}/.assay/src/CsAssay.Runner/bin/Release/net11.0/cs-assay.dll
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check shared case catalogue and archive digests
        run: ./cross-playground/playground check
      - name: Checkout matching CSharpAssay source
        uses: actions/checkout@v6
        with:
          repository: CanonFlow-Assay/CSharpAssay
          ref: ${{ inputs.assay_ref || vars.CSHARP_ASSAY_REF || '4fec9e9825c8bcf2e5037b5f9a6c48ba9cd25fed' }}
          path: .assay
      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify rootless Podman
        run: |
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
      - name: Build local .NET 11 packages
        run: ./eng/prepare-assay.sh .assay --bootstrap-locks
      - name: Enforce every sample's strict .NET 11 mandate
        run: ./eng/run-all-samples.sh
      - name: Verify native sample parity
        run: |
          mkdir -p evidence/generated/native-parity
          dotnet "$ASSAY_RUNNER" verify samples/native-parity/Parity.Domain/Parity.Domain.csproj \
            --profile native --policy .csassay.parity.json \
            --json evidence/generated/native-parity/verify.json \
            --sarif evidence/generated/native-parity/verify.sarif
      - name: Run playground gate
        run: ./eng/run-assay.sh .assay/src/CsAssay.Runner/bin/Release/net11.0/cs-assay.dll
      - name: Verify the payment saga and its negative controls
        run: ./eng/run-saga-assay.sh "$ASSAY_RUNNER" evidence/generated/saga-assay
      - name: Run native GoF crosswalk
        run: ./eng/run-gof-crosswalk.sh
      - name: Run Functional Shape evidence
        run: ./eng/run-functional-shape.sh
      - name: Test local advice gateway offline
        run: ./eng/tooling test-local-advice
      - name: Test mutation execution failure boundaries
        run: ./eng/tooling test-mutation-cases
      - name: Test order investigation evidence boundaries
        run: ./eng/tooling test-shape-investigations

      - name: Run decision assistance experiment offline
        run: ./eng/tooling run-decision-assistance
      - name: Evaluate decision scenarios offline
        run: ./eng/tooling evaluate-decision-assistance
      - name: Measure order-sample coverage and mutations offline
        run: ./eng/tooling run-shape-investigations
      - name: Verify CsvHelper functional consumer and offline investigations
        run: ./eng/run-csvhelper.sh .assay/src/CsAssay.Runner/bin/Release/net11.0/cs-assay.dll
      - name: Qualify Polly and packaged new-application workflow offline
        env:
          ASSAY_RUNNER: ${{ github.workspace }}/.assay/src/CsAssay.Runner/bin/Release/net11.0/cs-assay.dll
        run: ./eng/run-application-workflow.sh
      - name: Qualify ExpenseGuard with real PostgreSQL and offline advice
        run: |
          echo '::add-matcher::.github/expenseguard-problem-matcher.json'
          ./eng/run-expenseguard.sh --output "$PWD/evidence/generated/expenseguard/ci"
      - name: Exercise packaged analyzer, business-test and missing-evidence repair
        run: |
          ./eng/tooling with-inventory-database -- \
            ./eng/tooling exercise-change-verification \
            --output "$PWD/evidence/generated/expenseguard/change-verification-ci"
      - name: Upload evidence
        if: always() && hashFiles('evidence/generated/**/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: csharp-assay-net11-evidence
          path: evidence/generated/
          if-no-files-found: error
          retention-days: 14
